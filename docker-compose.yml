services:
  # Opcional: o app já embute um broker (D11). O Mosquitto serve para testar o modo
  # "broker externo" localmente e para assinar tópicos com mosquitto_sub.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tcc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
